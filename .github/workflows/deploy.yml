name: Build & Deploy to Vercel

# Every push to main: typecheck + Vite build → static prerender of all 28
# routes (home + 27 city pages) → deploy the prebuilt static site to Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript + Vite)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium (for pre-rendering)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Pre-render all routes to static HTML
        run: python3 scripts/prerender.py

      - name: Deploy dist/ to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy dist --prod --yes --token "$VERCEL_TOKEN"
