name: Build & Deploy to GitHub Pages

# Every push to main: typecheck + Vite build -> static prerender of all 79
# routes (home + 27 city pages + blog index + 50 blog posts) -> deploy the
# prebuilt static site to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (TypeScript + Vite)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate FAQ schema + sitemap from source data
        run: |
          python3 scripts/gen_faq_schema.py
          python3 scripts/gen_sitemap.py

      - name: Install Playwright + Chromium (for pre-rendering)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Pre-render all routes to static HTML
        run: python3 scripts/prerender.py

      - name: Add CNAME for custom domain
        run: echo "amigolocksmith.com" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
