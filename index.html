    <script type="application/ld+json" id="home-faq-schema">
            {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {"@type": "Question", "name": "How fast can a locksmith get to me in Grand Prairie or DFW?", "acceptedAnswer": {"@type": "Answer", "text": "Because DFWKeyMaster is a fully mobile locksmith based in Grand Prairie, our average arrival time is 15–25 minutes within Grand Prairie and 20–45 minutes across the rest of the Dallas–Fort Worth metroplex, including Arlington, Irving, Dallas, Fort Worth, Mansfield, Duncanville, Cedar Hill, Plano and Frisco. When you call (682) 666-2966, we give you a real-time ETA before you hang up."}},
        {"@type": "Question", "name": "How much does a locksmith cost in Grand Prairie, TX?", "acceptedAnswer": {"@type": "Answer", "text": "Most car lockouts in Grand Prairie start at $65, house lockouts start at $75, and lock rekeys start at $25 per cylinder. Transponder key cutting and programming starts at $145 — often 40–60% less than a dealership. We always quote the full price before any work begins, so you never pay a surprise fee."}},
        {"@type": "Question", "name": "Can you make a car key if I lost all my keys?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Our mobile units carry key-cutting and programming equipment for most makes and models, including transponder keys, smart keys and proximity fobs. We can originate a brand-new key from your vehicle's lock or VIN and program it on the spot — no towing to a dealership required."}},
        {"@type": "Question", "name": "Are you available 24 hours a day, even on weekends and holidays?", "acceptedAnswer": {"@type": "Answer", "text": "Yes — DFWKeyMaster operates 24/7/365, including nights, weekends and holidays. Lockouts don't keep business hours, and neither do we. Emergency calls are answered by a real dispatcher, not a voicemail."}},
        {"@type": "Question", "name": "Will opening my car or house damage the lock?", "acceptedAnswer": {"@type": "Answer", "text": "No. We use professional, non-destructive entry techniques — picks, decoders and air-wedge tools — that open vehicles and doors without damaging the lock, door or paint. Drilling is an absolute last resort and is always discussed with you first."}},
        {"@type": "Question", "name": "What should I do right now if I'm locked out?", "acceptedAnswer": {"@type": "Answer", "text": "Stay calm and safe, don't force the lock or try coat-hanger tricks (they cause expensive damage), and call (682) 666-2966. Tell us your location, vehicle or door type, and whether there are children or pets inside — those calls are prioritized above everything else."}},
        {"@type": "Question", "name": "Do you rekey locks after buying a new home or after a tenant moves out?", "acceptedAnswer": {"@type": "Answer", "text": "Absolutely — rekeying is one of our most requested services across DFW. We re-pin your existing locks so old keys stop working, and can key all your locks to a single key. It's far cheaper than replacing every lock and just as secure."}},
        {"@type": "Question", "name": "Can you program key fobs and push-to-start smart keys?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. We program transponder keys, remote head keys, and push-to-start proximity fobs for most domestic and import vehicles on-site, wherever the car is parked — usually for far less than dealer pricing."}},
        {"@type": "Question", "name": "Are your locksmiths licensed and insured?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. DFWKeyMaster technicians are licensed under the Texas Department of Public Safety Private Security Bureau, background-checked, uniformed, and fully insured. Ask for the license number any time — we're proud to show it."}},
        {"@type": "Question", "name": "Do you charge extra for nights, weekends or emergencies?", "acceptedAnswer": {"@type": "Answer", "text": "After-hours emergency service may carry a modest dispatch fee, but we quote the complete price — service call plus labor plus parts — before we start. The price we quote is the price you pay. No bait-and-switch, ever."}},
        {"@type": "Question", "name": "What's the full price breakdown for each service?", "acceptedAnswer": {"@type": "Answer", "text": "Every job starts with a flat dispatch/service-call fee, then labor and any parts. Car lockouts start at $65, house lockouts at $75, rekeys at $25 per cylinder, transponder cutting and programming at $145, and smart lock installation at $120 plus the hardware. You get one itemized number before we touch anything — and that's the number on the invoice."}},
        {"@type": "Question", "name": "Is it cheaper to use a mobile locksmith than a car dealership for key fobs?", "acceptedAnswer": {"@type": "Answer", "text": "Almost always, yes — typically 40–60% less. Dealerships bundle key fobs with towing, shop fees and multi-day waits; we cut and program the same OEM-quality fob in your driveway in one visit. For most makes we save customers $100–$250 compared to the dealer quote."}},
        {"@type": "Question", "name": "How do master key systems work for small businesses, and what do they cost?", "acceptedAnswer": {"@type": "Answer", "text": "A master key system re-pins your locks into a hierarchy — employees open only their areas, managers open more, and your master key opens everything. We design the levels around your floor plan and staff roles. A basic small-office system starts around $25–$45 per cylinder plus setup, and we map it all out before quoting."}},
        {"@type": "Question", "name": "How often should a business change or re-key its master key system?", "acceptedAnswer": {"@type": "Answer", "text": "Re-key any time a key-holder leaves, a key goes missing, or you suspect a copy was made — don't wait. As a routine, most DFW small businesses re-key every 1–2 years or after any turnover in a master-holding role. Because rekeying re-pins rather than replaces, staying current is inexpensive."}},
        {"@type": "Question", "name": "What's involved in smart lock installation, and which brands are compatible?", "acceptedAnswer": {"@type": "Answer", "text": "We fit the lock to your door, connect it to your Wi-Fi or hub, pair your phones, and walk you through the app and access codes. We install and configure Schlage, Kwikset, Yale, August, and most major brands, and we'll tell you upfront whether your existing door and deadbolt prep are compatible."}},
        {"@type": "Question", "name": "Is a smart lock a good DIY project, or should it be professionally installed?", "acceptedAnswer": {"@type": "Answer", "text": "Many smart locks are DIY-friendly if your door is standard and aligned, but misaligned strikes, older doors, and hub/network setup trip people up constantly. A professional install guarantees the bolt throws cleanly, the auto-lock actually engages, and your codes and app are configured securely — usually in under an hour."}},
        {"@type": "Question", "name": "How can I tell a legitimate locksmith from a scam?", "acceptedAnswer": {"@type": "Answer", "text": "Red flags: unmarked vehicles, no company uniform or ID, refusing to give a written quote, and a '$19 service call' that balloons into hundreds on-site. A legitimate locksmith is licensed with the Texas DPS, arrives in a branded vehicle, shows ID and a license number, and quotes the full price before starting. We're happy to show all of it."}},
        {"@type": "Question", "name": "What should I do the moment I realize I'm locked out of my car?", "acceptedAnswer": {"@type": "Answer", "text": "First, check every door and the trunk — one is often unlocked. If a child or pet is inside, call 911 immediately, then us. Otherwise move somewhere safe, note your exact location, and call (682) 666-2966. Don't pry the door or use a coat hanger — modern weatherstripping and linkages damage easily and cost far more than a clean unlock."}},
        {"@type": "Question", "name": "Can a broken key stuck in a lock be extracted without replacing the whole lock?", "acceptedAnswer": {"@type": "Answer", "text": "Usually, yes. We use spiral and hooked extractors to pull the broken blade out without harming the cylinder, then cut you a fresh key on the spot. Replacement is only needed if the lock was already worn or damaged — and we'll tell you honestly before doing anything more."}},
        {"@type": "Question", "name": "What are the warning signs my ignition cylinder is failing vs. just a worn key?", "acceptedAnswer": {"@type": "Answer", "text": "A worn key struggles in one lock but works elsewhere; a failing ignition sticks, won't turn, or needs jiggling with any key, and may leave you unable to remove the key. If the steering wheel locks up or the key won't rotate past ACC, that's the cylinder. We diagnose it on-site and repair or replace the cylinder — often without a dealer trip."}},
        {"@type": "Question", "name": "Can you open a safe if I lost or forgot the combination, and is it damage-free?", "acceptedAnswer": {"@type": "Answer", "text": "In most cases we open safes non-destructively using manipulation and electronic diagnostics, so the safe stays fully usable. Drilling is a last resort and always discussed first. After opening we can reset the combination or replace the lock, and we verify ownership before any safe work."}},
        {"@type": "Question", "name": "Do you handle motorcycle, RV, and trunk lockouts, and is the equipment different?", "acceptedAnswer": {"@type": "Answer", "text": "Yes — motorcycles, RVs, and trunks all use different keyways and locking mechanisms than standard car doors, and we carry the specific blanks, picks, and decoders for them. Motorcycle gas caps and RV compartment locks in particular need specialized tools, which is why not every locksmith takes these calls. We do."}},
        {"@type": "Question", "name": "What payment methods do you accept?", "acceptedAnswer": {"@type": "Answer", "text": "We accept all major credit and debit cards, cash, Apple Pay, Google Pay, and Zelle. Payment is collected on completion, and you always receive a written, itemized receipt. For commercial accounts we can arrange invoicing."}},
        {"@type": "Question", "name": "What information should I have ready when I call?", "acceptedAnswer": {"@type": "Answer", "text": "Have your exact address or location, the vehicle year/make/model (or the door/lock type for a property), and a callback number. For your security we'll verify ownership — a registration, title, ID matching the address, or proof of residence. The more you can tell us upfront, the faster we dispatch the right technician and equipment."}},
        {"@type": "Question", "name": "Do you provide a free upfront quote before the technician arrives, and do you guarantee your work?", "acceptedAnswer": {"@type": "Answer", "text": "Yes to both. We give you a clear, no-obligation quote over the phone based on what you describe, and confirm the final price on-site before starting. All labor and parts are backed by a workmanship guarantee — if something we installed or serviced fails, we come back and make it right."}}
      ]
    }
